[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgedeck-companion"
version = "1.0.0"
description = "Read-only ForgeDeck companion endpoints (status, metrics, leads, events) as a FastAPI router."
requires-python = ">=3.9"
dependencies = ["fastapi>=0.100"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24", "jsonschema>=4.18"]

[tool.setuptools]
packages = ["forgedeck_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
